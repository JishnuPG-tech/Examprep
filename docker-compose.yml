services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: examprep
      POSTGRES_USER: examprep
      POSTGRES_PASSWORD: examprep
    ports: ["5432:5432"]
    volumes: ["examprep_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U examprep -d examprep"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  examprep_pg:
