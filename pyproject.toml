[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "examprep"
version = "0.1.0"
description = "Production-oriented banking exam document and question processing pipeline"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3", "pydantic-settings>=2.5,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pymupdf>=1.24,<2", "httpx>=0.27,<1", "python-multipart>=0.0.9,<1", "structlog>=24,<26", "rapidfuzz>=3.9,<4"]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13,<1", "Pillow>=10,<12"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1"]

[project.scripts]
examprep = "examprep.cli:app"

[tool.setuptools.packages.find]
include = ["examprep*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
